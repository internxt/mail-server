apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-server
  labels:
    app: mail-server
    owner: internxt
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mail-server
  template:
    metadata:
      labels:
        app: mail-server
        owner: internxt
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mail-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: RDS_HOSTNAME
              value: {{ .Values.database.host | quote }}
            - name: RDS_PORT
              value: {{ .Values.database.port | quote }}
            - name: RDS_DBNAME
              value: {{ .Values.database.name | quote }}
            - name: RDS_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: STALWART_JMAP_URL
              value: {{ .Values.stalwart.jmapUrl | quote }}
            - name: STALWART_ADMIN_URL
              value: {{ .Values.stalwart.adminUrl | quote }}
            - name: STALWART_SMTP_HOST
              value: {{ .Values.stalwart.smtpHost | quote }}
            - name: STALWART_SMTP_PORT
              value: {{ .Values.stalwart.smtpPort | quote }}
            - name: PAYMENTS_API_URL
              value: {{ .Values.paymentsApiUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.redisUrl | quote }}
            - name: MTA_HOOKS_USERNAME
              value: {{ .Values.mta.hooksUsername | quote }}

          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
