apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  labels:
    app: stalwart
    owner: internxt
spec:
  serviceName: stalwart
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
        owner: internxt
      annotations:
        checksum/config: {{ .Values.dataStore | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 2000
        runAsUser: 2000
        runAsGroup: 2000
      containers:
        - name: stalwart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/stalwart/config.json"
          ports:
            - name: management
              containerPort: {{ .Values.service.ports.management }}
            - name: http
              containerPort: {{ .Values.service.ports.http }}
            - name: https
              containerPort: {{ .Values.service.ports.https }}
            - name: smtp
              containerPort: {{ .Values.service.ports.smtp }}
            - name: smtps
              containerPort: {{ .Values.service.ports.smtps }}
            - name: submission
              containerPort: {{ .Values.service.ports.submission }}
            - name: imap
              containerPort: {{ .Values.service.ports.imap }}
            - name: imaps
              containerPort: {{ .Values.service.ports.imaps }}
            - name: pop3
              containerPort: {{ .Values.service.ports.pop3 }}
            - name: pop3s
              containerPort: {{ .Values.service.ports.pop3s }}
            - name: managesieve
              containerPort: {{ .Values.service.ports.managesieve }}
          env:
            - name: STALWART_ROLE
              value: {{ .Values.role | quote }}
            - name: STALWART_PUSH_SHARD
              value: {{ .Values.pushShard | quote }}
            - name: STALWART_RECOVERY_MODE
              value: {{ .Values.recoveryMode.enabled | ternary "true" "false" | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          # livenessProbe:
          #   httpGet:
          #     path: /healthz/live
          #     port: management
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /healthz/ready
          #     port: management
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/stalwart
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: stalwart-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
