apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  labels:
    app: stalwart
    owner: internxt
spec:
  serviceName: stalwart
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
        owner: internxt
      annotations:
        checksum/config: {{ .Values.dataStore | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 2000
        runAsUser: 2000
        runAsGroup: 2000
      containers:
        - name: stalwart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/stalwart/config.json"
          ports:
            - name: management
              containerPort: {{ .Values.mailService.ports.management.port }}
            - name: https
              containerPort: 443
            - name: smtp
              containerPort: {{ .Values.mailService.ports.smtp.port }}
            - name: smtps
              containerPort: {{ .Values.mailService.ports.smtps.port }}
            - name: submission
              containerPort: {{ .Values.mailService.ports.submission.port }}
            - name: imap
              containerPort: {{ .Values.mailService.ports.imap.port }}
            - name: imaps
              containerPort: {{ .Values.mailService.ports.imaps.port }}
            - name: pop3
              containerPort: {{ .Values.mailService.ports.pop3.port }}
            - name: pop3s
              containerPort: {{ .Values.mailService.ports.pop3s.port }}
            - name: managesieve
              containerPort: {{ .Values.mailService.ports.managesieve.port }}
          env:
            - name: STALWART_ROLE
              value: {{ .Values.role | quote }}
            - name: STALWART_PUSH_SHARD
              value: {{ .Values.pushShard | quote }}
            - name: STALWART_RECOVERY_MODE
              value: {{ .Values.recoveryMode.enabled | ternary "true" "false" | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/stalwart
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: stalwart-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
