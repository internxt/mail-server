{{- if .Values.ingress.enabled }}
{{- $mainHost := .Values.ingress.host | lower }}
{{- $seen := dict }}
{{- range .Values.ingress.mtaStsHosts | default list }}
{{- $host := . | lower }}
{{- $slug := $host | replace "." "-" }}
{{- if eq $host $mainHost }}
{{- fail (printf "ingress.mtaStsHosts must not contain ingress.host (%s): that would publish a rule for it with no ipAllowList middleware" $mainHost) }}
{{- end }}
{{- if hasKey $seen $slug }}
{{- fail (printf "ingress.mtaStsHosts contains a duplicate entry for %s" $host) }}
{{- end }}
{{- $_ := set $seen $slug true }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "stalwart-%s" $slug | quote }}
  labels:
    app: stalwart
    owner: internxt
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /.well-known/mta-sts.txt
            pathType: Exact
            backend:
              service:
                name: stalwart
                port:
                  number: {{ $.Values.service.port }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-tls" $slug | quote }}
{{- end }}
{{- end }}
