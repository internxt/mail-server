{{- if and .Values.ingress.enabled .Values.ingress.restricted.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart-restricted-ingress
  labels:
    app: stalwart
    owner: internxt
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-stalwart-restricted-allowlist@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range .Values.ingress.restricted.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
