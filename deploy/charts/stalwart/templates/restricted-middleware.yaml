{{- if and .Values.ingress.enabled .Values.ingress.restricted.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stalwart-restricted-allowlist
  labels:
    app: stalwart
    owner: internxt
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.ingress.restricted.allowedCidrs }}
      - {{ . | quote }}
      {{- end }}
{{- end }}
