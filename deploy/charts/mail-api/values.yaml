replicaCount: 2

image:
  repository: internxt/mail-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: LoadBalancer
  port: 3100

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeEnv: production

driveApiUrl: "https://gateway.internxt.com/drive"
bridgeApiUrl: "https://gateway.internxt.com/network"

database:
  host: postgres-postgresql
  port: "5432"
  name: mail
  username: postgres

stalwart:
  jmapUrl: http://stalwart:8080
  adminUrl: http://stalwart:8080
  adminUser: mail-api
  masterUser: master

mta:
  hooksUsername: stalwart

secretName: mail-api-secrets

probes:
  liveness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
